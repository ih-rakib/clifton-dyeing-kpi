# Build & Deploy Dashboard
#
# Publishes the committed, encrypted dashboard bundle to GitHub Pages.
#
# The data is built LOCALLY with `python scripts/build.py` (the source Excel
# workbooks are not stored in this repository) and the encrypted output is
# committed. This workflow therefore only verifies and deploys the site.
#
# Runs ONLY when you push to `main` (or when you click "Run workflow").
#
# (c) 2026 Ikramul Hasan Rakib - Executive, Central IE Department, Clifton Group

name: Build & Deploy Dashboard

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "dashboard/**"
      - "requirements.txt"
      - ".github/workflows/deploy.yml"
  # Lets you trigger a rebuild manually from the Actions tab.
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify encrypted site & upload
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the bundle is encrypted and no plaintext data is published
        run: |
          set -e
          test -s dashboard/data/data.enc.js
          grep -q 'window.DASHBOARD_DATA_ENC' dashboard/data/data.enc.js
          if grep -q 'window.DASHBOARD_DATA =' dashboard/data/data.enc.js; then
            echo "::error::Plaintext data bundle detected. Run 'python scripts/build.py' locally and commit the encrypted output."
            exit 1
          fi
          for f in dashboard/data/data.js dashboard/data/data.json; do
            if [ -e "$f" ]; then
              echo "::error::$f must not be published. Keep plaintext only in the git-ignored build/ folder."
              exit 1
            fi
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
